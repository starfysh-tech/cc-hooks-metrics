[project]
name = "hooks-report"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["rich>=14.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hooks_report*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
